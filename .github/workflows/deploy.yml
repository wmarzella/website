name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Verify deploy credential is present
        env:
          KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ACTIONS_DEPLOY_KEY is not set on this repository."
            echo "Publishing to motis-group/motis-group.github.io is a cross-repository"
            echo "push, so the built-in GITHUB_TOKEN cannot authorise it."
            echo "Create the key pair and install both halves with scripts/setup-deploy-key.sh."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static publish directory
        run: |
          mkdir -p _site
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/
          echo "motis.group" > _site/CNAME
          touch _site/.nojekyll

      - name: Publish to motis-group.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: motis-group/motis-group.github.io
          publish_branch: main
          publish_dir: ./_site
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.repository }}@${{ github.sha }}"
